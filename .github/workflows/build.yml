name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-dotnet:
    name: Build .NET Desktop Application (Primary)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore esim-manager.sln
      
    - name: Build
      run: dotnet build esim-manager.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test esim-manager.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish
      run: |
        dotnet publish ESimManager/ESimManager.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained false `
          --output ./publish
          
    - name: Create installer package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./ESimManager-win-x64.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esim-manager-build
        path: ./publish
        
    - name: Upload installer package
      uses: actions/upload-artifact@v4
      with:
        name: esim-manager-installer
        path: ./ESimManager-win-x64.zip

  build-api:
    name: Build API (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check if API source exists
      id: check-api
      run: |
        if [ -d "api/src" ] && [ -f "api/tsconfig.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "API source not found - skipping build"
        fi
      
    - name: Setup Node.js
      if: steps.check-api.outputs.exists == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      if: steps.check-api.outputs.exists == 'true'
      working-directory: ./api
      run: npm install
      
    - name: Build API
      if: steps.check-api.outputs.exists == 'true'
      working-directory: ./api
      run: npm run build
      
    - name: Upload API artifacts
      if: steps.check-api.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: api/dist

  build-web:
    name: Build Web Application (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check if Web source exists
      id: check-web
      run: |
        if [ -d "web/src" ] && [ -f "web/next.config.js" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Web source not found - skipping build"
        fi
      
    - name: Setup Node.js
      if: steps.check-web.outputs.exists == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      if: steps.check-web.outputs.exists == 'true'
      working-directory: ./web
      run: npm install
      
    - name: Build Web
      if: steps.check-web.outputs.exists == 'true'
      working-directory: ./web
      run: npm run build
      
    - name: Upload Web artifacts
      if: steps.check-web.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: web/.next

  release:
    name: Create Release
    needs: [build-dotnet]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Desktop installer
      uses: actions/download-artifact@v4
      with:
        name: esim-manager-installer
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ESimManager-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
