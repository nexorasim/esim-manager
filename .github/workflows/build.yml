name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-dotnet:
    name: Build .NET Desktop Application
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore esim-manager.sln
      
    - name: Build
      run: dotnet build esim-manager.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test esim-manager.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish
      run: |
        dotnet publish ESimManager/ESimManager.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained false `
          --output ./publish
          
    - name: Create installer package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./ESimManager-win-x64.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esim-manager-build
        path: ./publish
        
    - name: Upload installer package
      uses: actions/upload-artifact@v4
      with:
        name: esim-manager-installer
        path: ./ESimManager-win-x64.zip

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json
        
    - name: Install dependencies
      working-directory: ./api
      run: npm ci || npm install
      
    - name: Build API
      working-directory: ./api
      run: npm run build
      
    - name: Upload API artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: api/dist

  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      working-directory: ./web
      run: npm ci || npm install
      
    - name: Build Web
      working-directory: ./web
      run: npm run build
      
    - name: Upload Web artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: web/.next

  release:
    name: Create Release
    needs: [build-dotnet, build-api, build-web]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Desktop installer
      uses: actions/download-artifact@v4
      with:
        name: esim-manager-installer
        
    - name: Download API build
      uses: actions/download-artifact@v4
      with:
        name: api-build
        path: api-dist
        
    - name: Download Web build
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: web-dist
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ESimManager-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
