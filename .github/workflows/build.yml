name: Build and Deploy to Firebase

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-dotnet:
    name: Build .NET Desktop Application
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore esim-manager.sln
      
    - name: Build
      run: dotnet build esim-manager.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test esim-manager.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish
      run: |
        dotnet publish ESimManager/ESimManager.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained false `
          --output ./publish
          
    - name: Create installer package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./ESimManager-win-x64.zip
        
    - name: Upload installer package
      uses: actions/upload-artifact@v4
      with:
        name: esim-manager-installer
        path: ./ESimManager-win-x64.zip

  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      working-directory: ./web
      run: npm ci || npm install
      
    - name: Build Web
      working-directory: ./web
      run: |
        npm run build
        npm run export
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      
    - name: Upload Web artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: web/out

  build-functions:
    name: Build Firebase Functions
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: functions/package.json
        
    - name: Install dependencies
      working-directory: ./functions
      run: npm ci || npm install
      
    - name: Build Functions
      working-directory: ./functions
      run: npm run build
      
    - name: Upload Functions artifacts
      uses: actions/upload-artifact@v4
      with:
        name: functions-build
        path: functions/lib

  deploy-firebase:
    name: Deploy to Firebase
    needs: [build-web, build-functions]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Web artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: web/out
        
    - name: Download Functions artifacts
      uses: actions/download-artifact@v4
      with:
        name: functions-build
        path: functions/lib
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
        
    - name: Deploy to Firebase
      run: firebase deploy --only hosting,firestore:rules,functions
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  release:
    name: Create Release
    needs: [build-dotnet, build-web, build-functions]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Desktop installer
      uses: actions/download-artifact@v4
      with:
        name: esim-manager-installer
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ESimManager-win-x64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
